<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Streams are often advertised over plain HTTP; ask the browser to upgrade them. -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="theme-color" content="#141414">
    <meta name="description" content="Live TV, movies and series in a Netflix-style interface.">

    <title>Netflix | TV</title>
    <link rel="icon" type="image/png" href="assets/img/favicon.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/hero.css">
    <link rel="stylesheet" href="assets/css/content.css">
    <link rel="stylesheet" href="assets/css/player.css">
    <link rel="stylesheet" href="assets/css/catalog.css">
    <link rel="stylesheet" href="assets/css/timer.css">

    <!-- Pinned to a major version: `@latest` would ship breaking releases straight to production. -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <script src="https://cdn.jsdelivr.net/npm/dashjs@4/dist/dash.all.min.js"></script>
</head>
<body>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <nav id="navbar">
        <div class="nav-left">
            <a class="logo" href="./">
                <img src="assets/img/netflix.png" alt="Netflix" class="logo-img">
            </a>

            <ul class="primary-navigation">
                <li class="nav-tab"><a href="./">Inicio</a></li>
                <li class="nav-tab always-visible"><a href="#" onclick="openSeries(); return false;">Series</a></li>
                <li class="nav-tab always-visible"><a href="#" onclick="openMovies(); return false;">Películas</a></li>
                <li class="nav-tab nav-dropdown-container" id="tv-nav-item">
                    <button class="nav-dropdown-btn" onclick="toggleDropdown()">
                        <span id="currentSectionLabel">TV</span>
                        <i class="fas fa-caret-down"></i>
                    </button>
                    <div class="nav-dropdown-menu" id="navDropdownMenu">
                        <!-- Populated by navigation.js -->
                    </div>
                </li>
                <li class="nav-tab toHide"><a href="https://www.netflix.com/browse">Netflix</a></li>
            </ul>
        </div>

        <div class="secondary-navigation">
            <!-- Watch-session stopwatch (see timer.js). -->
            <div class="watch-timer" id="watchTimer">
                <span class="watch-timer-time" id="watchTimerTime">00:00</span>
                <button class="watch-timer-btn watch-timer-toggle" onclick="toggleWatchTimer()" title="Start timer" aria-label="Start timer">
                    <i class="fas fa-play" id="watchTimerIcon"></i>
                </button>
                <button class="watch-timer-btn" onclick="resetWatchTimer()" title="Reset timer" aria-label="Reset timer">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
            <div class="search-box" id="searchBox">
                <button class="search-icon-btn" onclick="toggleSearchBox()" aria-label="Search">
                    <i class="fas fa-search"></i>
                </button>
                <input type="text" class="search-input" placeholder="Titles, people, genres" id="searchInput" oninput="handleSearch(this.value)">
            </div>
            <div class="nav-element toHide"><i class="far fa-bell"></i></div>
            <div class="nav-element profile-menu">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profile" class="profile-img">
                <i class="fas fa-caret-down caret-icon"></i>
            </div>
        </div>
    </nav>

    <!-- Placeholder shown until the playlist has been parsed. -->
    <div id="skeleton-loader">
        <div class="skeleton-hero">
            <div class="shimmer sk-text sk-title"></div>
            <div class="shimmer sk-text sk-desc"></div>
            <div class="shimmer sk-text sk-desc-2"></div>
            <div>
                <div class="shimmer sk-btn"></div>
                <div class="shimmer sk-btn"></div>
            </div>
        </div>
        <div class="sk-section">
            <div class="shimmer sk-header"></div>
            <div class="sk-row">
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
            </div>
        </div>
        <div class="sk-section">
            <div class="shimmer sk-header"></div>
            <div class="sk-row">
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
                <div class="shimmer sk-card"></div>
            </div>
        </div>
    </div>

    <header class="hero hidden" id="hero" onclick="playHeroChannel()">
        <video id="hero-video-bg" autoplay muted playsinline></video>
        <div class="hero-content">
            <div class="hero-label">TELEVISION</div>
            <h1 class="hero-title" id="hero-title">Loading...</h1>
            <p class="hero-desc" id="hero-desc">Experience the best live TV. Curated channels, instant access from around the globe.</p>
            <div class="hero-buttons">
                <button class="btn btn-play" onclick="playHeroChannel()"><i class="fas fa-play"></i> Play</button>
                <!-- stopPropagation, otherwise the hero click handler would open the player. -->
                <button class="btn btn-info" onclick="event.stopPropagation(); playRandom()"><i class="fas fa-random"></i> Random</button>
            </div>
        </div>
        <button class="hero-mute-btn" onclick="event.stopPropagation(); toggleHeroMute()" title="Mute/Unmute">
            <i class="fas fa-volume-mute" id="heroMuteIcon"></i>
        </button>
    </header>

    <div id="toast" class="toast">Notification</div>

    <div id="app-content" class="section section-home"></div>

    <!-- Collections modal -->
    <div class="modal-overlay" id="collectionModal" onclick="closeCollectionModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Manage Collections</div>
                <div class="modal-close" onclick="closeCollectionModal()"><i class="fas fa-times"></i></div>
            </div>
            <p class="modal-subtitle" id="collectionTargetName">Add to sections:</p>
            <div class="collection-input-group">
                <input type="text" class="collection-input" id="newSectionInput" placeholder="Create section..."
                       onkeypress="if(event.key === 'Enter') createNewSection()">
                <button class="btn btn-play modal-add-btn" onclick="createNewSection()">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <div class="collection-list" id="collectionList"></div>
        </div>
    </div>

    <!-- Player -->
    <div class="video-modal" id="videoModal">
        <div class="video-wrapper" id="videoWrapper" onclick="togglePlayerControls()">
            <video id="mainVideo" playsinline onclick="event.stopPropagation(); togglePlayerControls()"></video>
            <div id="ttml-rendering-div"></div>
            <!-- Outside .player-overlay on purpose: failover messages must stay
                 visible while the controls are hidden. -->
            <div class="player-status" id="playerStatus"></div>
            <div class="player-overlay" id="playerOverlay" onclick="event.stopPropagation(); togglePlayerControls()">
                <div class="player-top" onclick="event.stopPropagation()">
                    <div class="back-btn" onclick="closePlayer()"><i class="fas fa-arrow-left"></i></div>
                    <div class="player-title" id="playerTitle">Channel Name</div>
                    <div style="width: 40px;"></div>
                </div>
                <div class="player-center">
                    <div class="big-play-btn" onclick="event.stopPropagation(); togglePlay()"><i class="fas fa-pause" id="centerPlayIcon"></i></div>
                </div>
                <div id="playerCarousel" class="player-carousel" onclick="event.stopPropagation()">
                    <div class="carousel-track" id="playerCarouselList"></div>
                </div>
                <div class="player-bottom" onclick="event.stopPropagation()">
                    <div class="player-controls-left">
                        <button class="control-btn" onclick="togglePlay()" data-tooltip="Play/Pause"><i class="fas fa-pause" id="bottomPlayIcon"></i></button>
                        <div class="volume-group">
                            <button class="control-btn" onclick="toggleMute()" id="muteBtn" data-tooltip="Mute/Unmute">
                                <i class="fas fa-volume-up" id="volumeIcon"></i>
                            </button>
                            <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" id="volumeSlider" oninput="handleVolumeSlide(this.value)">
                        </div>
                        <div class="speed-controls">
                            <button class="control-btn small" onclick="adjustSpeed(-0.05)">-</button>
                            <span class="speed-display" id="speedDisplay">1.0x</span>
                            <button class="control-btn small" onclick="adjustSpeed(0.05)">+</button>
                        </div>
                    </div>
                    <div class="player-controls-right">
                        <button class="control-btn" id="castBtn" onclick="triggerChromecast()" data-tooltip="Cast to TV">
                            <i class="fab fa-chromecast"></i>
                        </button>
                        <button class="control-btn" onclick="togglePlayerCarousel()" data-tooltip="Favorites">
                            <i class="fas fa-chevron-up" id="carouselToggleIcon"></i>
                        </button>
                        <button class="control-btn" onclick="openCollectionModalForCurrent()" data-tooltip="Add to Section"><i class="fas fa-list"></i></button>
                        <button class="control-btn fav-btn" id="favBtn" onclick="toggleFavorite()" data-tooltip="Add to Favorites"><i class="far fa-heart"></i></button>
                        <button class="control-btn remove-btn" onclick="removeCurrentChannel(true)" data-tooltip="Remove Channel"><i class="fas fa-trash-alt"></i></button>
                        <button class="control-btn" onclick="togglePiP()" id="pipBtn" data-tooltip="Picture in Picture">
                            <i class="fas fa-clone"></i>
                        </button>
                        <button class="control-btn" onclick="toggleFullscreen()" data-tooltip="Fullscreen"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Load order matters: config and state first, main.js bootstraps last. -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/state.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/health.js"></script>
    <script src="assets/js/sources.js"></script>
    <script src="assets/js/stream.js"></script>
    <script src="assets/js/channels.js"></script>
    <script src="assets/js/navigation.js"></script>
    <script src="assets/js/render.js"></script>
    <script src="assets/js/collections.js"></script>
    <script src="assets/js/hero.js"></script>
    <script src="assets/js/player.js"></script>
    <script src="assets/js/chromecast.js"></script>
    <script src="assets/js/catalog.js"></script>
    <script src="assets/js/timer.js"></script>
    <script src="assets/js/main.js"></script>

    <!-- Must load after chromecast.js, which defines __onGCastApiAvailable. -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
